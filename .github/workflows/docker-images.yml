name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - "postgres/**"
      - "scripts/**"
      - ".github/workflows/docker-images.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "postgres/**"
      - "scripts/**"
      - ".github/workflows/docker-images.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Discover image versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail
          matrix="$(
            for kind in flutter postgres; do
              version_list="$(bash scripts/image-versions.sh "$kind")"
              mapfile -t versions <<< "$version_list"
              latest="${versions[${#versions[@]}-1]}"
              if [[ "$kind" == flutter ]]; then
                image=danilo55555/flutter-sdk
                platforms=linux/amd64,linux/arm64/v8
              else
                image=danilo55555/postgres
                platforms=linux/amd64
              fi
              for version in "${versions[@]}"; do
                is_latest=false
                [[ "$version" != "$latest" ]] || is_latest=true
                jq -cn --arg path "$kind/$version" --arg image "$image" \
                  --arg version "$version" --arg platforms "$platforms" \
                  --argjson latest "$is_latest" \
                  '{path: $path, image: $image, version: $version, platforms: $platforms, latest: $latest}'
              done
            done | jq -sc '{include: .}'
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.path }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:${{ matrix.version }}
            ${{ matrix.latest && format('{0}:latest', matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.path }}
          cache-to: type=gha,mode=max,scope=${{ matrix.path }}
