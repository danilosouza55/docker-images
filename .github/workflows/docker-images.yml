name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - "postgres/**"
      - ".github/workflows/docker-images.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "postgres/**"
      - ".github/workflows/docker-images.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - path: flutter/3.19.2
            image: danilo55555/flutter-sdk
            version: "3.19.2"
            platforms: linux/amd64,linux/arm64/v8
            latest: false
          - path: flutter/3.22.1
            image: danilo55555/flutter-sdk
            version: "3.22.1"
            platforms: linux/amd64,linux/arm64/v8
            latest: false
          - path: flutter/3.24.1
            image: danilo55555/flutter-sdk
            version: "3.24.1"
            platforms: linux/amd64,linux/arm64/v8
            latest: false
          - path: flutter/3.35.1
            image: danilo55555/flutter-sdk
            version: "3.35.1"
            platforms: linux/amd64,linux/arm64/v8
            latest: false
          - path: flutter/3.38.5
            image: danilo55555/flutter-sdk
            version: "3.38.5"
            platforms: linux/amd64,linux/arm64/v8
            latest: false
          - path: flutter/3.47.9
            image: danilo55555/flutter-sdk
            version: "3.47.9"
            platforms: linux/amd64,linux/arm64/v8
            latest: true
          - path: postgres/9.6
            image: danilo55555/postgres
            version: "9.6"
            platforms: linux/amd64
            latest: false
          - path: postgres/14.2
            image: danilo55555/postgres
            version: "14.2"
            platforms: linux/amd64
            latest: false
          - path: postgres/15.4
            image: danilo55555/postgres
            version: "15.4"
            platforms: linux/amd64
            latest: false
          - path: postgres/16.0
            image: danilo55555/postgres
            version: "16.0"
            platforms: linux/amd64
            latest: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.path }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:${{ matrix.version }}
            ${{ matrix.latest && format('{0}:latest', matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.path }}
          cache-to: type=gha,mode=max,scope=${{ matrix.path }}
